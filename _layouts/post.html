---
layout: default
---
<article class="post-shell">
  <p class="post-kicker"><a href="{{ '/blog/' | relative_url }}">Back to blog</a></p>
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
